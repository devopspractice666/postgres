---
- name: Copy docker-compose.yml from template
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_path }}/docker-compose.yml"
    mode: '0644'
  tags: [config]

- name: Start containers
  command:
    cmd: docker compose up -d
    chdir: "{{ project_path }}"
  tags: [start]

- name: Stop containers
  command:
    cmd: docker compose down
    chdir: "{{ project_path }}"
  tags: [stop, never]