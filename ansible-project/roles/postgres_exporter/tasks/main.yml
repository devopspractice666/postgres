---
- name: Create postgres_exporter user
  user:
    name: "{{ postgres_exporter_user }}"
    system: yes
    shell: /sbin/nologin
    create_home: no

- name: Check if postgres_exporter binary exists
  stat:
    path: "{{ postgres_exporter_bin }}"
  register: postgres_exporter_bin_stat

- name: Download postgres_exporter binary
  get_url:
    url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/postgres_exporter.tar.gz"
    timeout: 60
  when: not postgres_exporter_bin_stat.stat.exists

- name: Extract postgres_exporter binary
  unarchive:
    src: "/tmp/postgres_exporter.tar.gz"
    dest: "/tmp/"
    remote_src: yes
  when: not postgres_exporter_bin_stat.stat.exists

- name: Install postgres_exporter binary
  copy:
    src: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"
    dest: "{{ postgres_exporter_bin }}"
    mode: '0755'
    remote_src: yes
  when: not postgres_exporter_bin_stat.stat.exists

- name: Clean up temporary files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/postgres_exporter.tar.gz"
    - "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64"
  when: not postgres_exporter_bin_stat.stat.exists

- name: Create postgres_exporter systemd service
  template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    mode: '0644'

- name: Start and enable postgres_exporter
  systemd:
    name: postgres_exporter
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Stop and disable postgres_exporter service
  systemd:
    name: postgres_exporter
    state: stopped
    enabled: no
  tags: [stop, never]