---
- name: Create promtail user
  user:
    name: "{{ promtail_user }}"
    system: yes
    shell: /sbin/nologin
    create_home: no

- name: Create config directory
  file:
    path: "{{ promtail_config_dir }}"
    state: directory
    mode: '0755'

- name: Check if promtail binary exists
  stat:
    path: "{{ promtail_bin }}"
  register: promtail_bin_stat

- name: Download promtail binary
  get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-{{ promtail_arch }}.zip"
    dest: "/tmp/promtail.zip"
    timeout: 60
  when: not promtail_bin_stat.stat.exists

- name: Install unzip
  apt:
    name: unzip
    state: present
  when: ansible_os_family == "Debian" and not promtail_bin_stat.stat.exists

- name: Extract promtail
  unarchive:
    src: "/tmp/promtail.zip"
    dest: "/tmp/"
    remote_src: yes
  when: not promtail_bin_stat.stat.exists

- name: Install promtail binary
  copy:
    src: "/tmp/promtail-linux-{{ promtail_arch }}"
    dest: "{{ promtail_bin }}"
    mode: '0755'
    remote_src: yes
  when: not promtail_bin_stat.stat.exists

- name: Copy promtail config
  template:
    src: promtail.yml.j2
    dest: "{{ promtail_config_dir }}/promtail.yml"
    mode: '0644'

- name: Copy systemd service
  template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    mode: '0644'

- name: Reload systemd, start and enable promtail
  systemd:
    name: promtail
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Stop promtail
  systemd:
    name: promtail
    state: stopped
    enabled: no
  tags: [stop, never]