---
- name: Deploy PostgreSQL database
  hosts: db_host
  roles:
    - db

- name: Deploy application
  hosts: app_host
  roles:
    - myapp

- name: Deploy Node Exporter on all servers
  hosts: all
  become: true
  roles:
    - node_exporter

- name: Deploy Postgres Exporter on database servers
  hosts: db_host
  become: true
  roles:
    - postgres_exporter